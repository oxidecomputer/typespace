[package]
name = "typespace"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/oxidecomputer/typespace"
description = "Model Rust types for code generation"
readme = "../README.md"

[dependencies]
codespace = { workspace = true }
heck = { workspace = true }
log = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
expectorate = { workspace = true }
json-serde = { workspace = true }
newline-converter = { workspace = true }
prettyplease = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
typespace-test-macro = { path = "../typespace-test-macro" }
