[workspace]
members = [
	"typespace",
	"typespace-test-macro",
]

resolver = "2"

[workspace.dependencies]
codespace = { git = "https://github.com/oxidecomputer/codespace" }
expectorate = "1.2.0"
heck = "0.5.0"
json-serde = { git = "https://github.com/oxidecomputer/json-serde" }
log = "0.4.29"
newline-converter = "0.3.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.104"
quote = "1.0.42"
serde = "1.0.228"
serde_json = "1.0.148"
syn = { version = "2.0.114", features = ["full"] }
thiserror = "2.0.17"
