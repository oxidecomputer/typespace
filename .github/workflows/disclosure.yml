#
# Label a PR that still needs a human reader.
#
# This job looks for either when the PR is opened and sets the
# `requires-human-review` label. Nothing clears the label but a maintainer who
# has read the diff. It runs in the base repository's context so it can label
# PRs from forks; it reads the PR through the API and never checks out or runs
# the PR's code.
#
name: Human review

on:
  pull_request_target:
    types: [ opened ]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
    - name: Look for the markers
      run: |
        set -euo pipefail

        gh pr view "$PR" --json body,commits > pr.json

        found=0
        if jq -e '.body // "" | test("<!-- requires human review -->")' \
            pr.json > /dev/null; then
          found=1
        fi
        if jq -e '[.commits[].messageBody
                   | test("(^|\\n)Human-Review: required[ \\t]*(\\n|$)")] | any' \
            pr.json > /dev/null; then
          found=1
        fi

        if [ "$found" = 1 ]; then
          gh label create requires-human-review --force --color 0e8a16 \
            --description "Nobody has read this change yet; a maintainer will"
          gh pr edit "$PR" --add-label requires-human-review
        fi
